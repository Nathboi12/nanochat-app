<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Nanochat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1120;
  --ink-2:#141C33;
  --paper:#F7F5F0;
  --paper-2:#EFEBE1;
  --slate:#7A84A3;
  --slate-2:#3C4360;
  --goal:#B6FF3C;
  --goal-dim:#8FCC2E;
  --normal:#FF6B4A;
  --normal-dim:#E85536;
  --violet:#7C6CFF;
  --line:rgba(122,132,163,0.22);
  --accent: var(--goal);
  --accent-dim: var(--goal-dim);
  --radius: 18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--ink);
  color:var(--paper);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
[data-profile="normal"]{ --accent: var(--normal); --accent-dim: var(--normal-dim); }
h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; }
.mono{ font-family:'JetBrains Mono',monospace; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,textarea{ font-family:inherit; color:inherit; }
::-webkit-scrollbar{ width:0; height:0; }

#app{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  background:linear-gradient(180deg,var(--ink) 0%, var(--ink-2) 100%);
  display:flex;
  flex-direction:column;
  position:relative;
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
}

/* ---------- TOP BAR / PROFILE TOGGLE ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  padding:14px 16px 10px;
  background:linear-gradient(180deg, var(--ink) 70%, transparent);
  backdrop-filter:blur(6px);
}
.topbar-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.brand{ display:flex; align-items:center; gap:8px; }
.brand .dot{ width:10px; height:10px; border-radius:3px; background:var(--accent); transition:background .3s; transform:rotate(45deg); }
.brand span{ font-weight:700; font-size:18px; }
.topbar-icons{ display:flex; gap:14px; align-items:center; }
.icon-btn{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); border:1px solid var(--line); font-size:15px; }

/* Dual profile split toggle - signature element */
.dual-toggle{
  position:relative;
  display:flex;
  border-radius:999px;
  background:var(--ink-2);
  border:1px solid var(--line);
  padding:4px;
  height:46px;
}
.dual-toggle .slider{
  position:absolute; top:4px; left:4px; bottom:4px;
  width:calc(50% - 4px);
  border-radius:999px;
  background:var(--goal);
  transition: transform .35s cubic-bezier(.65,0,.35,1), background .35s;
  z-index:0;
}
[data-profile="normal"] .dual-toggle .slider{ transform:translateX(100%); background:var(--normal); }
.dual-toggle button{
  position:relative; z-index:1; flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  font-weight:600; font-size:13px; color:var(--slate); transition:color .3s;
  padding:0 8px;
}
.dual-toggle button.active{ color:#0B1120; }
.dual-toggle .streak{ font-size:11px; opacity:.75; }

/* ---------- BOTTOM NAV ---------- */
.bottomnav{
  position:sticky; bottom:0; z-index:30;
  display:flex; justify-content:space-around; align-items:center;
  padding:10px 6px calc(10px + env(safe-area-inset-bottom));
  background:rgba(11,17,32,0.92); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
}
.navbtn{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9px; color:var(--slate); padding:4px 4px; border-radius:10px; }
.navbtn.active{ color:var(--accent); }
.navbtn .ic{ font-size:17px; }

/* ---------- SCREEN ---------- */
.screen{ flex:1; padding:4px 16px 18px; }
.section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--slate); margin:18px 0 10px; display:flex; justify-content:space-between; align-items:center;}
.card{ background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px; }

/* ---------- STORIES ---------- */
.stories{ display:flex; gap:12px; overflow-x:auto; padding:6px 2px 14px; }
.story{ display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; width:62px; }
.story .ring{ width:58px; height:58px; border-radius:50%; padding:2.5px; background:conic-gradient(from 180deg, var(--accent), var(--violet), var(--accent)); }
.story .ring.seen{ background:var(--slate-2); }
.story .avatar{ width:100%; height:100%; border-radius:50%; background:var(--ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; border:2px solid var(--ink-2); }
.story span{ font-size:10.5px; color:var(--slate); max-width:60px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.story.add .ring{ background:var(--ink-2); border:1.5px dashed var(--slate); }

/* ---------- POST ---------- */
.post{ background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:14px; overflow:hidden; }
.post-head{ display:flex; align-items:center; gap:10px; padding:12px 14px 8px; }
.avatar-sm{ width:38px; height:38px; border-radius:50%; background:var(--ink); border:1.5px solid var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
.post-head .who{ flex:1; }
.post-head .name{ font-weight:600; font-size:13.5px; }
.post-head .meta{ font-size:11px; color:var(--slate); }
.badge-chip{ font-size:9.5px; background:rgba(182,255,60,0.12); color:var(--accent); padding:2px 7px; border-radius:6px; font-weight:600; margin-left:6px; }
.post-body{ padding:0 14px 10px; font-size:14px; line-height:1.5; color:#EDEBE4; }
.hashtag{ color:var(--accent); font-weight:600; cursor:pointer; }
.post-media{ height:170px; margin:0 0 8px; background:linear-gradient(135deg, var(--accent) 0%, var(--ink-2) 120%); opacity:.85; display:flex; align-items:flex-end; padding:10px 14px; font-size:11px; color:#0B1120; font-weight:600;}
.post-actions{ display:flex; align-items:center; gap:18px; padding:8px 14px 12px; border-top:1px solid var(--line); font-size:12.5px; color:var(--slate); }
.post-actions button{ display:flex; align-items:center; gap:5px; color:var(--slate); }
.post-actions button.liked{ color:var(--accent); }
.comments{ padding:0 14px 12px; }
.comment{ font-size:12.5px; margin-bottom:6px; color:#D8D5CC; }
.comment b{ color:#fff; }
.comment-input{ display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line); }
.comment-input input{ flex:1; background:var(--ink); border:1px solid var(--line); border-radius:999px; padding:8px 12px; font-size:12.5px; }
.comment-input button{ color:var(--accent); font-weight:700; font-size:12.5px; }

/* composer */
.composer{ display:flex; gap:10px; align-items:center; background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:10px 12px; margin-bottom:14px;}
.composer input{ flex:1; background:transparent; border:none; outline:none; font-size:13.5px; }
.composer button{ background:var(--accent); color:#0B1120; font-weight:700; font-size:12px; padding:8px 14px; border-radius:10px; }

/* ---------- GOAL HUB ---------- */
.goal-cat-scroll{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; }
.cat-pill{ flex-shrink:0; padding:8px 14px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line); color:var(--slate); background:var(--ink-2); }
.cat-pill.active{ background:var(--accent); color:#0B1120; border-color:var(--accent); }
.progress-track{ height:8px; border-radius:6px; background:var(--ink); overflow:hidden; margin:8px 0; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--accent-dim), var(--accent)); border-radius:6px; transition:width .4s; }
.milestone{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
.milestone:last-child{ border-bottom:none; }
.milestone .check{ width:22px; height:22px; border-radius:7px; border:1.5px solid var(--slate); display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
.milestone.done .check{ background:var(--accent); border-color:var(--accent); color:#0B1120; }
.milestone .label{ font-size:13.5px; flex:1; }
.milestone.done .label{ color:var(--slate); text-decoration:line-through; }
.badges-row{ display:flex; gap:10px; overflow-x:auto; padding:4px 2px; }
.badge{ flex-shrink:0; width:78px; text-align:center; }
.badge .icon{ width:56px; height:56px; border-radius:16px; background:var(--ink); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 6px; }
.badge.unlocked .icon{ background:radial-gradient(circle at 30% 30%, var(--accent), var(--accent-dim)); }
.badge.locked .icon{ opacity:.35; filter:grayscale(1); }
.badge span{ font-size:10px; color:var(--slate); }
.cheer-row{ display:flex; align-items:center; gap:-8px; margin-top:6px;}
.cheer-avatars{ display:flex; }
.cheer-avatars .avatar-sm{ width:28px; height:28px; font-size:10px; margin-left:-8px; border-width:2px; border-color:var(--ink-2); box-shadow:0 0 0 2px var(--ink-2);}
.cheer-avatars .avatar-sm:first-child{ margin-left:0; }
.checkin-box{ background:var(--ink); border:1px dashed var(--slate-2); border-radius:14px; padding:12px; margin-top:6px;}
.checkin-box textarea{ width:100%; background:transparent; border:none; outline:none; resize:none; font-size:13px; color:#fff; min-height:44px; }
.btn-primary{ background:var(--accent); color:#0B1120; font-weight:700; font-size:12.5px; padding:10px 16px; border-radius:12px; width:100%; text-align:center; margin-top:8px;}
.btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--paper); font-weight:600; font-size:12px; padding:8px 14px; border-radius:10px;}

/* ---------- FOR YOU (real vertical swipe feed) ---------- */
.fy-feed{ height:calc(100vh - 210px); overflow-y:auto; scroll-snap-type:y mandatory; margin:0 -16px; }
.fy-slide{ position:relative; height:calc(100vh - 210px); scroll-snap-align:start; background:#000; overflow:hidden; }
.fy-slide img, .fy-slide video{ width:100%; height:100%; object-fit:cover; display:block; }
.fy-overlay{ position:absolute; left:0; right:70px; bottom:0; padding:16px; background:linear-gradient(0deg, rgba(0,0,0,0.75), transparent); }
.fy-author{ display:flex; align-items:center; gap:8px; margin-bottom:8px; color:#fff; font-size:13px; cursor:pointer; }
.fy-author .avatar-sm{ border-color:#fff; }
.fy-caption{ color:#fff; font-size:13px; line-height:1.4; }
.fy-actions{ position:absolute; right:10px; bottom:20px; display:flex; flex-direction:column; gap:18px; align-items:center; }
.fy-actions button{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:20px; color:#fff; }
.fy-actions button span{ font-size:10px; font-weight:600; }
.fy-actions button.liked{ color:var(--normal); }

/* ---------- SEARCH ---------- */
.search-bar{ display:flex; align-items:center; gap:8px; background:var(--ink-2); border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin-bottom:14px;}
.search-bar input{ flex:1; background:transparent; border:none; outline:none; font-size:14px; }
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.result-row{ display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line);}
.result-row .info{ flex:1; }
.result-row .name{ font-weight:600; font-size:13.5px; }
.result-row .sub{ font-size:11.5px; color:var(--slate); }

/* ---------- MESSAGES ---------- */
.convo-row{ display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line);}
.convo-row .info{ flex:1; min-width:0; }
.convo-row .name{ font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:6px; }
.convo-row .preview{ font-size:12px; color:var(--slate); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.convo-row .time{ font-size:10.5px; color:var(--slate); }
.unread-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); }
.group-avatar{ width:44px; height:44px; border-radius:50%; background:var(--violet); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}

.chat-screen{ display:flex; flex-direction:column; height:calc(100vh - 20px); }
.chat-header{ display:flex; align-items:center; gap:10px; padding:10px 4px 14px; border-bottom:1px solid var(--line); }
.chat-header .info{flex:1;}
.chat-header .name{font-weight:700; font-size:14.5px;}
.chat-header .status{font-size:11px; color:var(--goal);}
.chat-header .actions{ display:flex; gap:10px; }
.chat-body{ flex:1; overflow-y:auto; padding:14px 2px; display:flex; flex-direction:column; gap:10px; }
.pinned-banner{ display:flex; align-items:center; gap:8px; background:var(--ink-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:11.5px; color:var(--slate); margin-bottom:6px;}
.bubble-wrap{ display:flex; flex-direction:column; max-width:78%; }
.bubble-wrap.me{ align-self:flex-end; align-items:flex-end; }
.bubble-wrap.them{ align-self:flex-start; align-items:flex-start; }
.reply-ref{ font-size:10.5px; color:var(--slate); border-left:2px solid var(--accent); padding-left:6px; margin-bottom:3px; }
.bubble{ padding:10px 13px; border-radius:16px; font-size:13.5px; line-height:1.4; }
.bubble-wrap.me .bubble{ background:var(--accent); color:#0B1120; border-bottom-right-radius:5px; }
.bubble-wrap.them .bubble{ background:var(--ink-2); border:1px solid var(--line); border-bottom-left-radius:5px; }
.bubble.sticker{ font-size:38px; background:transparent; padding:2px; }
.bubble-time{ font-size:9.5px; color:var(--slate); margin-top:3px; }
.typing-indicator{ display:flex; gap:4px; padding:10px 13px; background:var(--ink-2); border:1px solid var(--line); border-radius:16px; width:fit-content; }
.typing-indicator span{ width:6px; height:6px; border-radius:50%; background:var(--slate); animation:blink 1.2s infinite; }
.typing-indicator span:nth-child(2){ animation-delay:.2s; }
.typing-indicator span:nth-child(3){ animation-delay:.4s; }
@keyframes blink{ 0%,80%,100%{opacity:.3;} 40%{opacity:1;} }
.chat-input-row{ display:flex; align-items:center; gap:8px; padding:10px 2px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
.chat-input-row input{ flex:1; background:var(--ink-2); border:1px solid var(--line); border-radius:999px; padding:10px 14px; font-size:13.5px; outline:none; }
.round-btn{ width:36px; height:36px; border-radius:50%; background:var(--ink-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:15px;}
.round-btn.send{ background:var(--accent); color:#0B1120; }
.gif-tray{ display:flex; gap:8px; overflow-x:auto; padding:8px 2px; }
.gif-chip{ flex-shrink:0; width:64px; height:44px; border-radius:9px; background:var(--ink-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:20px; }
.sticker-chip{ flex-shrink:0; font-size:24px; width:44px; height:44px; border-radius:9px; background:var(--ink-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }

/* ---------- NANO AI ---------- */
.nano-header{ display:flex; align-items:center; gap:12px; padding:10px 2px 14px; }
.nano-orb{ width:42px; height:42px; border-radius:50%; background:radial-gradient(circle at 30% 30%, var(--violet), #2A1F6B); display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 0 18px rgba(124,108,255,0.5); flex-shrink:0;}
.nano-header .name{ font-weight:700; font-size:15px; }
.nano-header .tag{ font-size:11px; color:var(--violet); }
.nano-bubble{ background:var(--ink-2); border:1px solid rgba(124,108,255,0.35); border-radius:16px; border-bottom-left-radius:5px; padding:11px 14px; font-size:13.5px; line-height:1.5; max-width:88%; }
.nano-bubble .action{ margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:12px; color:var(--goal); font-weight:600; }
.suggest-row{ display:flex; gap:8px; overflow-x:auto; padding:6px 2px 12px; }
.suggest-chip{ flex-shrink:0; font-size:12px; padding:8px 13px; border-radius:12px; background:rgba(124,108,255,0.1); border:1px solid rgba(124,108,255,0.35); color:#C9C2FF; }

/* ---------- SETTINGS / SECURITY ---------- */
.settings-group{ margin-bottom:18px; }
.settings-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--line); font-size:13.5px; }
.settings-row .label{ display:flex; flex-direction:column; }
.settings-row .sub{ font-size:11px; color:var(--slate); margin-top:2px; }
.toggle{ width:42px; height:24px; border-radius:999px; background:var(--slate-2); position:relative; flex-shrink:0; transition:background .2s;}
.toggle.on{ background:var(--accent); }
.toggle .knob{ width:19px; height:19px; border-radius:50%; background:#fff; position:absolute; top:2.5px; left:2.5px; transition:transform .2s; }
.toggle.on .knob{ transform:translateX(18px); }
.profile-header{ display:flex; flex-direction:column; align-items:center; padding:14px 0 20px; text-align:center; }
.profile-avatar{ width:84px; height:84px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--violet)); display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; color:#0B1120; margin-bottom:10px;}
.stat-row{ display:flex; gap:10px; margin-top:14px; }
.stat-box{ flex:1; background:var(--ink-2); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center; }
.stat-box .num{ font-size:19px; font-weight:700; }
.stat-box .lbl{ font-size:10px; color:var(--slate); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }

.hidden{ display:none !important; }
.empty-state{ text-align:center; padding:40px 20px; color:var(--slate); font-size:13px; }

/* ---------- LIVE (TikTok-style) ---------- */
.live-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.live-tile{ position:relative; border-radius:16px; overflow:hidden; aspect-ratio:9/13; background:linear-gradient(160deg, var(--slate-2), var(--ink)); border:1px solid var(--line); display:flex; flex-direction:column; justify-content:space-between; padding:9px; }
.live-tile .pulse-badge{ display:flex; align-items:center; gap:4px; font-size:9.5px; font-weight:700; background:#FF3B3B; padding:3px 7px; border-radius:6px; width:fit-content; }
.live-tile .pulse-badge .dot{ width:5px; height:5px; border-radius:50%; background:#fff; animation:pulseLive 1.2s infinite; }
@keyframes pulseLive{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
.live-tile .viewers{ font-size:9.5px; background:rgba(0,0,0,0.45); backdrop-filter:blur(4px); padding:3px 7px; border-radius:6px; align-self:flex-start; }
.live-tile .bottom{ display:flex; align-items:center; gap:6px; }
.live-tile .avatar-sm{ width:26px; height:26px; font-size:10px; border-color:#fff; }
.live-tile .who{ font-size:11px; font-weight:600; color:#fff; }
.live-tile .cat{ font-size:9.5px; color:#D8D5CC; }
.go-live-card{ display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, rgba(124,108,255,0.18), var(--ink-2)); border:1px solid rgba(124,108,255,0.4); border-radius:16px; padding:14px; margin-bottom:16px; }
.go-live-card .icon{ width:44px; height:44px; border-radius:12px; background:var(--violet); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.go-live-card .txt{ flex:1; }
.go-live-card .txt b{ font-size:13.5px; display:block; }
.go-live-card .txt span{ font-size:11px; color:var(--slate); }

.live
