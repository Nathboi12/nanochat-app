/* ---------------------- VIEW OTHER USER'S PROFILE ---------------------- */
async function viewProfile(userId){
  if(!userId) return;
  if(userId === state.user.id){ go('profile'); return; }
  state.viewedProfile = { loading: true, id: userId };
  go('viewprofile', userId);
  try{
    const { user } = await api(`/users/${userId}`);
    state.viewedProfile = { ...user, loading:false };
    if(state.screen==='viewprofile') render();
  }catch(err){
    state.viewedProfile = { loading:false, error: err.message };
    if(state.screen==='viewprofile') render();
  }
}
function renderViewProfile(){
  const v = state.viewedProfile;
  if(!v) return `<div class="empty-state">No profile loaded.</div>`;
  if(v.loading) return `<div class="empty-state">Loading profile…</div>`;
  if(v.error) return `<div class="empty-state">${esc(v.error)}</div>`;
  return `
    <button class="icon-btn" style="width:28px;height:28px;font-size:13px;margin-bottom:10px;" onclick="go('feed')">←</button>
    <div class="profile-header">
      ${v.avatarUrl ? `<img src="${API_BASE_URL+v.avatarUrl}" style="width:84px;height:84px;border-radius:50%;object-fit:cover;margin-bottom:10px;"/>` : `<div class="profile-avatar">${(v.name||'?').slice(0,2).toUpperCase()}</div>`}

function renderEditProfile(){
  const u = state.user;
  return `
    <div class="section-title"><button class="icon-btn" style="width:28px;height:28px;font-size:13px;" onclick="go('profile')">←</button>&nbsp;Edit Profile</div>
    <div style="text-align:center;margin:10px 0 20px;">
      <div class="avatar-upload-wrap">
        ${u.avatarImage ? `<img src="${u.avatarImage}"/>` : `<div class="profile-avatar" style="margin:0;">${u.initials}</div>`}
        <div class="avatar-edit-btn" onclick="$('avatarFileInput').click()">✎</div>
      </div>
      <input type="file" id="avatarFileInput" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)"/>
      <div style="font-size:11.5px;color:var(--slate);">Tap the pencil to change your photo</div>
    </div>

      <label>Name</label>

    </div>

    <div class="field-group">
      <label>Bio</label>
      <textarea id="editBio" maxlength="150" oninput="$('bioCount').textContent = 150 - this.value.length">${esc(u.bio||'')}</textarea>
      <div class="char-count" id="bioCount">${150 - (u.bio||'').length}</div>
    </div>

    <div class="field-group">
      <label>Website</label>
      <input id="editWebsite" placeholder="yourname.com" value="${esc(u.website||'')}"/>
    </div>

    <button class="btn-primary" onclick="saveProfile()">Save changes</button>
  `;
}
function handleAvatarUpload(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(isOnline()){
    const form = new FormData();
    form.append('avatar', file);
    api('/users/me/avatar', { method:'POST', body:form, isForm:true })
      .then(data => { state.user.avatarImage = API_BASE_URL + data.avatarUrl; render(); go('editprofile'); })
      .catch(err => alert(err.message));
    return;
  }
  const reader = new FileReader();
  reader.onload = function(ev){
    state.user.avatarImage = ev.target.result;
    render();
    go('editprofile');
  };
  reader.readAsDataURL(file);
}
function saveProfile(){
  const name = $('editName').value.trim() || state.user.name;
  const bio = $('editBio').value.trim();
  const website = $('editWebsite').value.trim();
  state.user.name = name;
  state.user.initials = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  state.user.bio = bio;
  state.user.website = website;
  if(isOnline()){
    api('/users/me', { method:'PATCH', body:{ name, bio, website } }).catch(err=>console.error(err));
  }
  go('profile');
}

/* ---------------------- PERSISTENCE (localStorage) ---------------------- */
const STORAGE_KEY = 'nanochat-app-state';
// IMPORTANT: localStorage is UI-preference-only now. Posts, goals, messages, stories,
// live streams, badges, and user profile data are NEVER cached here — they always come
// fresh from the backend. Only harmless local UI state persists across visits.
function saveState(){
  try{
    const snapshot = {
      profile: state.profile,       // which toggle (Goal/Normal) was last active — a UI preference
      settings: state.settings,     // local-only toggles (no backend endpoint for these exists)
      nanoChat: state.nanoChat,     // Nano AI is rule-based and local-only, not backend-persisted
    };
    lsSet(STORAGE_KEY, JSON.stringify(snapshot));
  }catch(err){
    // localStorage can throw if quota is exceeded or disabled — fail quietly, app still works
  }
}
function loadState(){
  try{
    const raw = lsGet(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(saved.profile) state.profile = saved.profile;
      if(saved.settings) state.settings = saved.settings;
      if(saved.nanoChat) state.nanoChat = saved.nanoChat;
    }
  }catch(err){
    // no saved state yet, or corrupted — start fresh
  }
}

/* ---------------------- INIT ---------------------- */
(async function init(){
  loadState();
  document.getElementById('app').setAttribute('data-profile', state.profile);

  onUnauthorized = () => {
    // Only fires on a genuine 401 from the server (invalid/expired token) — never on network failures.
    authToken = null;
    lsRemove('nanochat-auth-token');
    renderAuth('login');
  };

  if (!API_BASE_URL) {
    render(); // no backend configured — pure local demo mode by design
    return;
  }

  const saved = lsGet('nanochat-auth-token');
  if (!saved) {
    renderAuth('login');
    return;
  }

  authToken = saved;
  try {
    const me = await api('/auth/me');
    applyUserFromServer(me.user);
    render();
    loadFeedFromServer();
  } catch (err) {
    if (err.status === 401 || err.status === 404) {
      // Token is genuinely invalid/expired, or the account no longer exists — safe to clear it.
      console.error('Nanochat: session invalid (status ' + err.status + ') —', err.message);
      authToken = null;
      lsRemove('nanochat-auth-token');
      renderAuth('login');
    } else {
      // Network failure, CORS block, or 5xx server error — the token is still potentially valid.
      // Do NOT clear it. Show a retry screen instead of forcing the user back to login.
      console.error('Nanochat: could not verify session (temporary error) —', err.message);
      renderConnectionError(err.message);
    }
  }
})();
</script>
