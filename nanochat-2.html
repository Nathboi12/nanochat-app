<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Nanochat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1120;
  --ink-2:#141C33;
  --paper:#F7F5F0;
  --paper-2:#EFEBE1;
  --slate:#7A84A3;
  --slate-2:#3C4360;
  --goal:#B6FF3C;
  --goal-dim:#8FCC2E;
  --normal:#FF6B4A;
  --normal-dim:#E85536;
  --violet:#7C6CFF;
  --line:rgba(122,132,163,0.22);
  --accent: var(--goal);
  --accent-dim: var(--goal-dim);
  --radius: 18px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--ink);
  color:var(--paper);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
[data-profile="normal"]{ --accent: var(--normal); --accent-dim: var(--normal-dim); }
h1,h2,h3,.display{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; }
.mono{ font-family:'JetBrains Mono',monospace; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input,textarea{ font-family:inherit; color:inherit; }
::-webkit-scrollbar{ width:0; height:0; }

#app{
  max-width:460px;
  margin:0 auto;
  min-height:100vh;
  background:linear-gradient(180deg,var(--ink) 0%, var(--ink-2) 100%);
  display:flex;
  flex-direction:column;
  position:relative;
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
}

/* ---------- TOP BAR / PROFILE TOGGLE ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  padding:14px 16px 10px;
  background:linear-gradient(180deg, var(--ink) 70%, transparent);
  backdrop-filter:blur(6px);
}
.topbar-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.brand{ display:flex; align-items:center; gap:8px; }
.brand .dot{ width:10px; height:10px; border-radius:3px; background:var(--accent); transition:background .3s; transform:rotate(45deg); }
.brand span{ font-weight:700; font-size:18px; }
.topbar-icons{ display:flex; gap:14px; align-items:center; }
.icon-btn{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); border:1px solid var(--line); font-size:15px; }

/* Dual profile split toggle - signature element */
.dual-toggle{
  position:relative;
  display:flex;
  border-radius:999px;
  background:var(--ink-2);
  border:1px solid var(--line);
  padding:4px;
  height:46px;
}
.dual-toggle .slider{
  position:absolute; top:4px; left:4px; bottom:4px;
  width:calc(50% - 4px);
  border-radius:999px;
  background:var(--goal);
  transition: transform .35s cubic-bezier(.65,0,.35,1), background .35s;
  z-index:0;
}
[data-profile="normal"] .dual-toggle .slider{ transform:translateX(100%); background:var(--normal); }
.dual-toggle button{
  position:relative; z-index:1; flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  font-weight:600; font-size:13px; color:var(--slate); transition:color .3s;
  padding:0 8px;
}
.dual-toggle button.active{ color:#0B1120; }
.dual-toggle .streak{ font-size:11px; opacity:.75; }

/* ---------- BOTTOM NAV ---------- */
.bottomnav{
  position:sticky; bottom:0; z-index:30;
  display:flex; justify-content:space-around; align-items:center;
  padding:10px 6px calc(10px + env(safe-area-inset-bottom));
  background:rgba(11,17,32,0.92); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
}
.navbtn{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9px; color:var(--slate); padding:4px 4px; border-radius:10px; }
.navbtn.active{ color:var(--accent); }
.navbtn .ic{ font-size:17px; }

/* ---------- SCREEN ---------- */
.screen{ flex:1; padding:4px 16px 18px; }
.section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--slate); margin:18px 0 10px; display:flex; justify-content:space-between; align-items:center;}
.card{ background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px; }

/* ---------- STORIES ---------- */
.stories{ display:flex; gap:12px; overflow-x:auto; padding:6px 2px 14px; }
.story{ display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0; width:62px; }
.story .ring{ width:58px; height:58px; border-radius:50%; padding:2.5px; background:conic-gradient(from 180deg, var(--accent), var(--violet), var(--accent)); }
.story .ring.seen{ background:var(--slate-2); }
.story .avatar{ width:100%; height:100%; border-radius:50%; background:var(--ink); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; border:2px solid var(--ink-2); }
.story span{ font-size:10.5px; color:var(--slate); max-width:60px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.story.add .ring{ background:var(--ink-2); border:1.5px dashed var(--slate); }

/* ---------- POST ---------- */
.post{ background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:14px; overflow:hidden; }
.post-head{ display:flex; align-items:center; gap:10px; padding:12px 14px 8px; }
.avatar-sm{ width:38px; height:38px; border-radius:50%; background:var(--ink); border:1.5px solid var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
.post-head .who{ flex:1; }
.post-head .name{ font-weight:600; font-size:13.5px; }
.post-head .meta{ font-size:11px; color:var(--slate); }
.badge-chip{ font-size:9.5px; background:rgba(182,255,60,0.12); color:var(--accent); padding:2px 7px; border-radius:6px; font-weight:600; margin-left:6px; }
.post-body{ padding:0 14px 10px; font-size:14px; line-height:1.5; color:#EDEBE4; }
.post-media{ height:170px; margin:0 0 8px; background:linear-gradient(135deg, var(--accent) 0%, var(--ink-2) 120%); opacity:.85; display:flex; align-items:flex-end; padding:10px 14px; font-size:11px; color:#0B1120; font-weight:600;}
.post-actions{ display:flex; align-items:center; gap:18px; padding:8px 14px 12px; border-top:1px solid var(--line); font-size:12.5px; color:var(--slate); }
.post-actions button{ display:flex; align-items:center; gap:5px; color:var(--slate); }
.post-actions button.liked{ color:var(--accent); }
.comments{ padding:0 14px 12px; }
.comment{ font-size:12.5px; margin-bottom:6px; color:#D8D5CC; }
.comment b{ color:#fff; }
.comment-input{ display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line); }
.comment-input input{ flex:1; background:var(--ink); border:1px solid var(--line); border-radius:999px; padding:8px 12px; font-size:12.5px; }
.comment-input button{ color:var(--accent); font-weight:700; font-size:12.5px; }

/* composer */
.composer{ display:flex; gap:10px; align-items:center; background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:10px 12px; margin-bottom:14px;}
.composer input{ flex:1; background:transparent; border:none; outline:none; font-size:13.5px; }
.composer button{ background:var(--accent); color:#0B1120; font-weight:700; font-size:12px; padding:8px 14px; border-radius:10px; }

/* ---------- GOAL HUB ---------- */
.goal-cat-scroll{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; }
.cat-pill{ flex-shrink:0; padding:8px 14px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line); color:var(--slate); background:var(--ink-2); }
.cat-pill.active{ background:var(--accent); color:#0B1120; border-color:var(--accent); }
.progress-track{ height:8px; border-radius:6px; background:var(--ink); overflow:hidden; margin:8px 0; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--accent-dim), var(--accent)); border-radius:6px; transition:width .4s; }
.milestone{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
.milestone:last-child{ border-bottom:none; }
.milestone .check{ width:22px; height:22px; border-radius:7px; border:1.5px solid var(--slate); display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }
.milestone.done .check{ background:var(--accent); border-color:var(--accent); color:#0B1120; }
.milestone .label{ font-size:13.5px; flex:1; }
.milestone.done .label{ color:var(--slate); text-decoration:line-through; }
.badges-row{ display:flex; gap:10px; overflow-x:auto; padding:4px 2px; }
.badge{ flex-shrink:0; width:78px; text-align:center; }
.badge .icon{ width:56px; height:56px; border-radius:16px; background:var(--ink); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 6px; }
.badge.unlocked .icon{ background:radial-gradient(circle at 30% 30%, var(--accent), var(--accent-dim)); }
.badge.locked .icon{ opacity:.35; filter:grayscale(1); }
.badge span{ font-size:10px; color:var(--slate); }
.cheer-row{ display:flex; align-items:center; gap:-8px; margin-top:6px;}
.cheer-avatars{ display:flex; }
.cheer-avatars .avatar-sm{ width:28px; height:28px; font-size:10px; margin-left:-8px; border-width:2px; border-color:var(--ink-2); box-shadow:0 0 0 2px var(--ink-2);}
.cheer-avatars .avatar-sm:first-child{ margin-left:0; }
.checkin-box{ background:var(--ink); border:1px dashed var(--slate-2); border-radius:14px; padding:12px; margin-top:6px;}
.checkin-box textarea{ width:100%; background:transparent; border:none; outline:none; resize:none; font-size:13px; color:#fff; min-height:44px; }
.btn-primary{ background:var(--accent); color:#0B1120; font-weight:700; font-size:12.5px; padding:10px 16px; border-radius:12px; width:100%; text-align:center; margin-top:8px;}
.btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--paper); font-weight:600; font-size:12px; padding:8px 14px; border-radius:10px;}

/* ---------- FOR YOU ---------- */
.fy-card{ position:relative; border-radius:var(--radius); overflow:hidden; height:220px; margin-bottom:14px; background:linear-gradient(160deg, var(--slate-2), var(--ink)); display:flex; flex-direction:column; justify-content:flex-end; padding:16px; border:1px solid var(--line);}
.fy-tag{ position:absolute; top:12px; left:12px; font-size:10px; background:rgba(255,255,255,0.1); backdrop-filter:blur(4px); padding:4px 9px; border-radius:7px; font-weight:600; }
.fy-card h3{ font-size:17px; margin:0 0 4px; }
.fy-card p{ font-size:12px; color:#D8D5CC; margin:0; }

/* ---------- SEARCH ---------- */
.search-bar{ display:flex; align-items:center; gap:8px; background:var(--ink-2); border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin-bottom:14px;}
.search-bar input{ flex:1; background:transparent; border:none; outline:none; font-size:14px; }
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.result-row{ display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line);}
.result-row .info{ flex:1; }
.result-row .name{ font-weight:600; font-size:13.5px; }
.result-row .sub{ font-size:11.5px; color:var(--slate); }

/* ---------- MESSAGES ---------- */
.convo-row{ display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line);}
.convo-row .info{ flex:1; min-width:0; }
.convo-row .name{ font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:6px; }
.convo-row .preview{ font-size:12px; color:var(--slate); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.convo-row .time{ font-size:10.5px; color:var(--slate); }
.unread-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); }
.group-avatar{ width:44px; height:44px; border-radius:50%; background:var(--violet); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}

.chat-screen{ display:flex; flex-direction:column; height:calc(100vh - 20px); }
.chat-header{ display:flex; align-items:center; gap:10px; padding:10px 4px 14px; border-bottom:1px solid var(--line); }
.chat-header .info{flex:1;}
.chat-header .name{font-weight:700; font-size:14.5px;}
.chat-header .status{font-size:11px; color:var(--goal);}
.chat-header .actions{ display:flex; gap:10px; }
.chat-body{ flex:1; overflow-y:auto; padding:14px 2px; display:flex; flex-direction:column; gap:10px; }
.pinned-banner{ display:flex; align-items:center; gap:8px; background:var(--ink-2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:11.5px; color:var(--slate); margin-bottom:6px;}
.bubble-wrap{ display:flex; flex-direction:column; max-width:78%; }
.bubble-wrap.me{ align-self:flex-end; align-items:flex-end; }
.bubble-wrap.them{ align-self:flex-start; align-items:flex-start; }
.reply-ref{ font-size:10.5px; color:var(--slate); border-left:2px solid var(--accent); padding-left:6px; margin-bottom:3px; }
.bubble{ padding:10px 13px; border-radius:16px; font-size:13.5px; line-height:1.4; }
.bubble-wrap.me .bubble{ background:var(--accent); color:#0B1120; border-bottom-right-radius:5px; }
.bubble-wrap.them .bubble{ background:var(--ink-2); border:1px solid var(--line); border-bottom-left-radius:5px; }
.bubble.sticker{ font-size:38px; background:transparent; padding:2px; }
.bubble-time{ font-size:9.5px; color:var(--slate); margin-top:3px; }
.typing-indicator{ display:flex; gap:4px; padding:10px 13px; background:var(--ink-2); border:1px solid var(--line); border-radius:16px; width:fit-content; }
.typing-indicator span{ width:6px; height:6px; border-radius:50%; background:var(--slate); animation:blink 1.2s infinite; }
.typing-indicator span:nth-child(2){ animation-delay:.2s; }
.typing-indicator span:nth-child(3){ animation-delay:.4s; }
@keyframes blink{ 0%,80%,100%{opacity:.3;} 40%{opacity:1;} }
.chat-input-row{ display:flex; align-items:center; gap:8px; padding:10px 2px calc(8px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
.chat-input-row input{ flex:1; background:var(--ink-2); border:1px solid var(--line); border-radius:999px; padding:10px 14px; font-size:13.5px; outline:none; }
.round-btn{ width:36px; height:36px; border-radius:50%; background:var(--ink-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:15px;}
.round-btn.send{ background:var(--accent); color:#0B1120; }
.gif-tray{ display:flex; gap:8px; overflow-x:auto; padding:8px 2px; }
.gif-chip{ flex-shrink:0; width:64px; height:44px; border-radius:9px; background:var(--ink-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:20px; }
.sticker-chip{ flex-shrink:0; font-size:24px; width:44px; height:44px; border-radius:9px; background:var(--ink-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }

/* ---------- NANO AI ---------- */
.nano-header{ display:flex; align-items:center; gap:12px; padding:10px 2px 14px; }
.nano-orb{ width:42px; height:42px; border-radius:50%; background:radial-gradient(circle at 30% 30%, var(--violet), #2A1F6B); display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 0 18px rgba(124,108,255,0.5); flex-shrink:0;}
.nano-header .name{ font-weight:700; font-size:15px; }
.nano-header .tag{ font-size:11px; color:var(--violet); }
.nano-bubble{ background:var(--ink-2); border:1px solid rgba(124,108,255,0.35); border-radius:16px; border-bottom-left-radius:5px; padding:11px 14px; font-size:13.5px; line-height:1.5; max-width:88%; }
.nano-bubble .action{ margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:12px; color:var(--goal); font-weight:600; }
.suggest-row{ display:flex; gap:8px; overflow-x:auto; padding:6px 2px 12px; }
.suggest-chip{ flex-shrink:0; font-size:12px; padding:8px 13px; border-radius:12px; background:rgba(124,108,255,0.1); border:1px solid rgba(124,108,255,0.35); color:#C9C2FF; }

/* ---------- SETTINGS / SECURITY ---------- */
.settings-group{ margin-bottom:18px; }
.settings-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--line); font-size:13.5px; }
.settings-row .label{ display:flex; flex-direction:column; }
.settings-row .sub{ font-size:11px; color:var(--slate); margin-top:2px; }
.toggle{ width:42px; height:24px; border-radius:999px; background:var(--slate-2); position:relative; flex-shrink:0; transition:background .2s;}
.toggle.on{ background:var(--accent); }
.toggle .knob{ width:19px; height:19px; border-radius:50%; background:#fff; position:absolute; top:2.5px; left:2.5px; transition:transform .2s; }
.toggle.on .knob{ transform:translateX(18px); }
.profile-header{ display:flex; flex-direction:column; align-items:center; padding:14px 0 20px; text-align:center; }
.profile-avatar{ width:84px; height:84px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--violet)); display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; color:#0B1120; margin-bottom:10px;}
.stat-row{ display:flex; gap:10px; margin-top:14px; }
.stat-box{ flex:1; background:var(--ink-2); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center; }
.stat-box .num{ font-size:19px; font-weight:700; }
.stat-box .lbl{ font-size:10px; color:var(--slate); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }

.hidden{ display:none !important; }
.empty-state{ text-align:center; padding:40px 20px; color:var(--slate); font-size:13px; }

/* ---------- LIVE (TikTok-style) ---------- */
.live-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.live-tile{ position:relative; border-radius:16px; overflow:hidden; aspect-ratio:9/13; background:linear-gradient(160deg, var(--slate-2), var(--ink)); border:1px solid var(--line); display:flex; flex-direction:column; justify-content:space-between; padding:9px; }
.live-tile .pulse-badge{ display:flex; align-items:center; gap:4px; font-size:9.5px; font-weight:700; background:#FF3B3B; padding:3px 7px; border-radius:6px; width:fit-content; }
.live-tile .pulse-badge .dot{ width:5px; height:5px; border-radius:50%; background:#fff; animation:pulseLive 1.2s infinite; }
@keyframes pulseLive{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
.live-tile .viewers{ font-size:9.5px; background:rgba(0,0,0,0.45); backdrop-filter:blur(4px); padding:3px 7px; border-radius:6px; align-self:flex-start; }
.live-tile .bottom{ display:flex; align-items:center; gap:6px; }
.live-tile .avatar-sm{ width:26px; height:26px; font-size:10px; border-color:#fff; }
.live-tile .who{ font-size:11px; font-weight:600; color:#fff; }
.live-tile .cat{ font-size:9.5px; color:#D8D5CC; }
.go-live-card{ display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, rgba(124,108,255,0.18), var(--ink-2)); border:1px solid rgba(124,108,255,0.4); border-radius:16px; padding:14px; margin-bottom:16px; }
.go-live-card .icon{ width:44px; height:44px; border-radius:12px; background:var(--violet); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.go-live-card .txt{ flex:1; }
.go-live-card .txt b{ font-size:13.5px; display:block; }
.go-live-card .txt span{ font-size:11px; color:var(--slate); }

.live-viewer{ position:fixed; inset:0; max-width:460px; margin:0 auto; background:linear-gradient(160deg, var(--slate-2) 0%, var(--ink) 55%); z-index:100; display:flex; flex-direction:column; }
.live-viewer .lv-top{ display:flex; align-items:center; gap:10px; padding:16px 14px 10px; }
.live-viewer .lv-top .who{ flex:1; display:flex; flex-direction:column; }
.live-viewer .lv-top .name{ font-size:13px; font-weight:700; }
.live-viewer .lv-top .viewers{ font-size:10.5px; color:#D8D5CC; }
.live-viewer .follow-btn{ background:var(--accent); color:#0B1120; font-weight:700; font-size:11.5px; padding:6px 12px; border-radius:8px; }
.live-viewer .close-btn{ font-size:20px; color:#fff; }
.lv-body{ flex:1; position:relative; display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; }
.lv-hearts{ position:absolute; right:14px; bottom:120px; width:30px; height:220px; pointer-events:none; }
.floating-heart{ position:absolute; bottom:0; font-size:22px; animation:floatUp 2.2s ease-in forwards; }
@keyframes floatUp{ 0%{ transform:translateY(0) translateX(0) scale(.6); opacity:1; } 100%{ transform:translateY(-200px) translateX(var(--driftx,10px)) scale(1.1); opacity:0; } }
.lv-chat{ max-height:180px; overflow-y:auto; padding:0 14px 8px; display:flex; flex-direction:column; gap:6px; -webkit-mask-image:linear-gradient(to bottom, transparent, black 20%); mask-image:linear-gradient(to bottom, transparent, black 20%); }
.lv-chat .msg{ font-size:12px; background:rgba(0,0,0,0.32); backdrop-filter:blur(3px); padding:5px 10px; border-radius:10px; width:fit-content; max-width:85%; }

   NANOCHAT MVP PROTOTYPE — single-file interactive demo
   ========================================================================= */

/* =========================================================================
   BACKEND INTEGRATION
   ========================================================================= */
const API_BASE_URL = 'https://nanochat-nmub.onrender.com';
let authToken = null;
let onUnauthorized = null; // called only on a genuine 401 (invalid/expired token)

async function api(path, { method = 'GET', body, isForm = false } = {}) {
  const headers = {};
  if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
  if (!isForm) headers['Content-Type'] = 'application/json';

  let res;
  try {
    res = await fetch(API_BASE_URL + path, {
      method,
      headers,
      body: body ? (isForm ? body : JSON.stringify(body)) : undefined,
    });
  } catch (networkErr) {
    // Genuine network failure (offline, DNS, CORS block, server unreachable) — no HTTP status at all.
    const e = new Error('Unable to connect to the Nanochat server. Check your internet connection and try again.');
    e.isNetworkError = true;
    throw e;
  }

  let data = null;
  try { data = await res.json(); } catch (_) { /* non-JSON response body */ }

  if (!res.ok) {
    const e = new Error((data && data.error) || `Something went wrong (error ${res.status}). Please try again.`);
    e.status = res.status; // 401, 404, 500, etc — callers use this to decide what to do
    if (res.status === 401 && onUnauthorized) onUnauthorized();
    throw e;
  }
  return data;
}
function isOnline() { return !!API_BASE_URL && !!authToken; }

/* ---------------------- SAFE LOCALSTORAGE ---------------------- */
const localStorageAvailable = (function(){
  try{
    const k = '__nanochat_test__';
    localStorage.setItem(k, '1');
    localStorage.removeItem(k);
    return true;
  }catch(e){
    console.error('Nanochat: localStorage is not available in this browser —', e.message);
    return false;
  }
})();
function lsGet(key){
  if(!localStorageAvailable) return null;
  try{ return localStorage.getItem(key); }catch(e){ console.error('Nanochat: localStorage read failed —', e.message); return null; }
}
function lsSet(key, value){
  if(!localStorageAvailable) return;
  try{ localStorage.setItem(key, value); }catch(e){ console.error('Nanochat: localStorage write failed —', e.message); }
}
function lsRemove(key){
  if(!localStorageAvailable) return;
  try{ localStorage.removeItem(key); }catch(e){ console.error('Nanochat: localStorage remove failed —', e.message); }
}

/* ---------------------- APPLY REAL USER DATA (never leave demo placeholders after auth) ---------------------- */
function applyUserFromServer(u){
  state.user.name = u.name;
  state.user.bio = u.bio || '';
  state.user.website = u.website || '';
  state.user.avatarImage = u.avatarUrl || null;
  state.user.initials = (u.name || '?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
  state.user.goalStreak = typeof u.goalStreak === 'number' ? u.goalStreak : 0;
  state.user.normalStreak = typeof u.normalStreak === 'number' ? u.normalStreak : 0;
  state.user.score = typeof u.score === 'number' ? u.score : 0;
  state.user.followers = typeof u.followers === 'number' ? u.followers : 0;
  state.user.following = typeof u.following === 'number' ? u.following : 0;
}

/* ---------------------- CONNECTION ERROR / RETRY SCREEN ---------------------- */
function renderConnectionError(message){
  document.getElementById('topbar').classList.add('hidden');
  document.getElementById('bottomnav').classList.add('hidden');
  document.getElementById('screen').innerHTML = `
    <div style="padding-top:90px;text-align:center;">
      <div style="font-size:40px;margin-bottom:16px;">⚠️</div>
      <h2 style="margin:0 0 10px;">Unable to connect</h2>
      <div style="color:var(--slate);font-size:13px;margin:0 24px 22px;line-height:1.5;">${esc(message)}</div>
      <button class="btn-primary" style="max-width:220px;margin:0 auto;" onclick="retryAuthCheck()">Try again</button>
      <div style="font-size:11px;color:var(--slate);margin-top:14px;">Your login is still saved — this will retry without asking you to sign in again.</div>
    </div>
  `;
}
async function retryAuthCheck(){
  const saved = lsGet('nanochat-auth-token');
  if(!saved){ renderAuth('login'); return; }
  authToken = saved;
  try{
    const me = await api('/auth/me');
    applyUserFromServer(me.user);
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('bottomnav').classList.remove('hidden');
    go('feed');
    loadFeedFromServer();
  }catch(err){
    if(err.status === 401 || err.status === 404){
      authToken = null;
      lsRemove('nanochat-auth-token');
      renderAuth('login');
    }else{
      renderConnectionError(err.message);
    }
  }
}

/* ---------------------- AUTH (online mode only) ---------------------- */
function renderAuthScreen(mode='login'){
  return `
    <div class="screen" style="padding-top:60px;">
      <div style="text-align:center;margin-bottom:26px;">
        <div class="brand" style="justify-content:center;"><div class="dot" style="background:var(--goal);"></div><span style="font-size:22px;">Nanochat</span></div>
        <div style="font-size:12.5px;color:var(--slate);margin-top:6px;">Connected to your live backend</div>
      </div>
      ${mode==='signup' ? `<div class="field-group"><label>Name</label><input id="authName" placeholder="Your name"/></div>` : ''}
      <div class="field-group"><label>Email</label><input id="authEmail" placeholder="you@example.com" type="email"/></div>
      <div class="field-group"><label>Password</label><input id="authPassword" placeholder="••••••••" type="password"/></div>
      <div id="authError" style="color:#FF6B4A;font-size:12px;margin-bottom:10px;"></div>
      <button class="btn-primary" onclick="submitAuth('${mode}')">${mode==='signup'?'Create account':'Log in'}</button>
      <div style="text-align:center;margin-top:14px;font-size:12.5px;color:var(--slate);">
        ${mode==='signup' ? `Already have an account? <a href="#" onclick="renderAuth('login');return false;" style="color:var(--accent);">Log in</a>`
                           : `New here? <a href="#" onclick="renderAuth('signup');return false;" style="color:var(--accent);">Create an account</a>`}
      </div>
    </div>
  `;
}
function renderAuth(mode){
  document.getElementById('topbar').classList.add('hidden');
  document.getElementById('bottomnav').classList.add('hidden');
  document.getElementById('screen').outerHTML = `<div id="screen">${renderAuthScreen(mode)}</div>`;
}
let authSubmitting = false;
async function submitAuth(mode){
  if(authSubmitting) return; // prevent duplicate requests from double-tapping
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  const errEl = $('authError');
  const btn = document.querySelector('.btn-primary');
  errEl.textContent = '';
  try{
    let data;
    if(mode==='signup'){
      const name = $('authName').value.trim();
      if(!name || !email || password.length < 8){ errEl.textContent = 'Fill in name, email, and an 8+ char password.'; return; }
      authSubmitting = true; if(btn){ btn.textContent = 'Creating account…'; btn.style.opacity = .7; }
      data = await api('/auth/signup', { method:'POST', body:{ name, email, password } });
    } else {
      if(!email || !password){ errEl.textContent = 'Enter your email and password.'; return; }
      authSubmitting = true; if(btn){ btn.textContent = 'Logging in…'; btn.style.opacity = .7; }
      data = await api('/auth/login', { method:'POST', body:{ email, password } });
    }
    authToken = data.token;
    lsSet('nanochat-auth-token', authToken);
    applyUserFromServer(data.user); // real backend data only — enters Feed directly, no second /auth/me call
    document.getElementById('topbar').classList.remove('hidden');
    document.getElementById('bottomnav').classList.remove('hidden');
    go('feed');
    loadFeedFromServer();
  }catch(err){
    errEl.textContent = err.message;
  }finally{
    authSubmitting = false;
  }
}
function logout(){
  authToken = null;
  lsRemove('nanochat-auth-token');
  renderAuth('login');
}

/* ---------------------- HELPERS ---------------------- */
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function $(id){ return document.getElementById(id); }

function setProfile(p){
  state.profile = p;
  document.getElementById('app').setAttribute('data-profile', p);
  renderTopbar();
  render();
  if(isOnline()) loadFeedFromServer();
}

function go(screen, param){
  state.screen = screen;
  if(param!==undefined) state.chatOpenId = param;
  render();
  window.scrollTo(0,0);
}

/* ---------------------- TOPBAR ---------------------- */
function renderTopbar(){
  $('goalStreakLbl').textContent = state.profile==='goal' ? ('🔥'+state.user.goalStreak) : '';
  $('btnGoalProfile').classList.toggle('active', state.profile==='goal');
  $('btnNormalProfile').classList.toggle('active', state.profile==='normal');
}

/* ---------------------- RENDER ROUTER ---------------------- */
function render(){
  renderTopbar();
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.scr===state.screen));
  const s = $('screen');
  const bottomnav = $('bottomnav');
  const topbar = $('topbar');
  bottomnav.classList.toggle('hidden', state.screen==='chat' || state.screen==='liveview');
  topbar.classList.toggle('hidden', state.screen==='liveview');
  switch(state.screen){
    case 'feed': s.innerHTML = renderFeed(); break;
    case 'foryou': s.innerHTML = renderForYou(); break;
    case 'live': s.innerHTML = renderLive(); break;
    case 'liveview': s.innerHTML = renderLiveViewer(state.liveOpenId); break;
    case 'goalhub': s.innerHTML = renderGoalHub(); if(isOnline() && !state._goalLoaded){ state._goalLoaded=true; loadGoalFromServer(state.activeCategory); } break;
    case 'search': s.innerHTML = renderSearch(); break;
    case 'messages': s.innerHTML = renderMessages(); if(isOnline() && !state._convosLoaded) loadConversationsFromServer(); break;
    case 'chat': s.innerHTML = renderChat(state.chatOpenId); scrollChatBottom(); break;
    case 'nano': s.innerHTML = renderNano(); scrollNanoBottom(); break;
    case 'profile': s.innerHTML = renderProfile(); break;
    case 'editprofile': s.innerHTML = renderEditProfile(); break;
    case 'settings': s.innerHTML = renderSettings(); break;
    case 'security': s.innerHTML = renderSecurity(); break;
    default: s.innerHTML = renderFeed();
  }
  saveState();
}

/* ---------------------- FEED ---------------------- */
function renderFeed(){
  const posts = state.posts[state.profile];
  const composerPlaceholder = state.profile==='goal' ? "Share progress on a goal..." : "What's on your mind?";
  let html = `
    <div class="stories">
      ${state.stories.map(st=>`
        <div class="story ${st.isAdd?'add':''}" onclick="${st.isAdd ? "$('storyFileInput').click()" : `viewStory('${st.id||''}')`}">
          <div class="ring ${st.seen?'seen':''}">
            ${st.avatarUrl ? `<img src="${st.avatarUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;"/>` : `<div class="avatar">${st.isAdd?'+':esc(st.initials)}</div>`}
          </div>
          <span>${esc(st.name)}</span>
        </div>`).join('')}
    </div>
    <input type="file" id="storyFileInput" accept="image/*" class="hidden" onchange="handleStoryUpload(event)"/>
    <div class="composer">
      <div class="avatar-sm">${state.user.initials}</div>
      <input placeholder="${composerPlaceholder}" id="composerInput"/>
      <button onclick="submitPost()">Post</button>
    </div>
  `;
  html += posts.map(p=>renderPost(p)).join('');
  return html;
}
async function loadStoriesFromServer(){
  if(!isOnline()) return;
  try{
    const { stories } = await api('/posts/stories/feed');
    const mine = {name:'You', initials: state.user.initials, seen:false, isAdd:true};
    state.stories = [mine, ...stories.map(s => ({
      id: s.id, name: s.author.name, initials: (s.author.name||'?').slice(0,2).toUpperCase(),
      avatarUrl: s.author.avatarUrl ? (API_BASE_URL + s.author.avatarUrl) : null, seen:false,
    }))];
    if(state.screen==='feed') render();
  }catch(err){ console.error('Failed to load stories', err); }
}
function handleStoryUpload(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!isOnline()){ alert('Log in to post a story.'); return; }
  const form = new FormData();
  form.append('file', file);
  api('/posts/media', { method:'POST', body:form, isForm:true })

async function sharePost(id){

  const shareText = `${p.name} on Nanochat: "${p.body}"`;
  if(navigator.share){
    try{ await navigator.share({ title:'Nanochat', text: shareText }); }
    catch(err){ /* user cancelled the share sheet — not an error */ }
    return;
  }
  try{
    await navigator.clipboard.writeText(shareText);
    alert('Copied to clipboard!');
  }catch(err){
    alert(shareText); // last-resort fallback so it's never silently broken
  }

function renderSearch(){
  return `

    <div class="chip-row">
      ${['Fitness','Career','Learning','#SundayReset','Finance','Mindset'].map(t=>`<button class="cat-pill" onclick="quickSearch('${t}')">${t}</button>`).join('')}
    </div>
    <div id="searchResults">${renderSearchResults('')}</div>
  `;
}
const searchPool = [
  {type:'topic', name:'#SundayReset', initials:'#', sub:'42.1k posts'},
  {type:'topic', name:'#30DayChallenge', initials:'#', sub:'8.4k posts'},
  {type:'goal', name:'Learn to Code', initials:'💻', sub:'2,110 people on this goal'},
];
let searchDebounceTimer = null;
function doSearch(){
  const q = $('searchInput').value;
  clearTimeout(searchDebounceTimer);
  if(isOnline()){
    $('searchResults').innerHTML = `<div class="empty-state">Searching…</div>`;
    searchDebounceTimer = setTimeout(async ()=>{
      try{
        const { users } = await api(`/users?q=${encodeURIComponent(q)}`);
        const peopleResults = users.map(u => ({ type:'person', id:u.id, name:u.name, initials:(u.name||'?').slice(0,2).toUpperCase(), sub: u.bio || 'Nanochat member' }));
        const topicResults = q ? searchPool.filter(r=>r.name.toLowerCase().includes(q.toLowerCase())) : searchPool;
        renderSearchResultsInto([...peopleResults, ...topicResults], q);
      }catch(err){
        $('searchResults').innerHTML = `<div class="empty-state">${esc(err.message)}</div>`;
      }
    }, 300);
    return;
  }
  $('searchResults').innerHTML = renderSearchResults(q);
}
function quickSearch(q){
  state.screen='search'; render();
  setTimeout(()=>{ $('searchInput').value=q; doSearch(); },0);
}
function renderSearchResultsInto(results, q){
  if(!results.length){ $('searchResults').innerHTML = `<div class="empty-state">No results for "${esc(q)}"</div>`; return; }
  $('searchResults').innerHTML = results.map(r=>`
    <div class="result-row">
      <div class="avatar-sm">${esc(r.initials)}</div>
      <div class="info"><div class="name">${esc(r.name)}</div><div class="sub">${esc(r.sub)}</div></div>
      ${r.type==='person' ? `<button class="btn-ghost" id="follow-${r.id}" onclick="toggleFollow('${r.id}', this)">Follow</button>` : `<button class="btn-ghost">View</button>`}
    </div>
  `).join('');
}
async function toggleFollow(userId, btn){
  const nowFollowing = btn.textContent.trim() === 'Follow';
  btn.disabled = true;
  try{
    await api(`/users/${userId}/follow`, { method: nowFollowing ? 'POST' : 'DELETE' });
    btn.textContent = nowFollowing ? 'Following' : 'Follow';
  }catch(err){
    alert(err.message);
  }finally{
    btn.disabled = false;
  }
}
function renderSearchResults(q){
  const filtered = q ? searchPool.filter(r=>r.name.toLowerCase().includes(q.toLowerCase())) : searchPool;
  if(!filtered.length) return `<div class="empty-state">No results for "${esc(q)}"</div>`;
  return filtered.map(r=>`
    <div class="result-row">
      <div class="avatar-sm">${esc(r.initials)}</div>
      <div class="info"><div class="name">${esc(r.name)}</div><div class="sub">${esc(r.sub)}</div></div>
      <button class="btn-ghost">View</button>
    </div>
  `).join('');
}

        ${['😂','🔥','😮','🎉','👏','💀'].map(g=>`<div class="gif-chip" onclick="sendGif('${id}','${g} reaction')">${g} GIF</div>`).join('')}
      </div>
      <div class="gif-tray hidden" id="stickerTray">
        ${['🎯','🚀','🏆','💪','🙌','✨'].map(s=>`<div class="sticker-chip" onclick="sendSticker('${id}','${s}')">${s}</div>`).join('')}
      </div>

        <input id="chatInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMessage('${id}')"/>

function toggleTray(elId){
  const el = $(elId);
  const other = elId==='gifTray'?'stickerTray':'gifTray';
  $(other).classList.add('hidden');
  el.classList.toggle('hidden');
}
function scrollChatBottom(){
  setTimeout(()=>{ const b=$('chatBody'); if(b) b.scrollTop = b.scrollHeight; },0);
  if(isOnline() && state.chatOpenId) startMessagePolling(state.chatOpenId);
}
let messagePollTimer = null;
function startMessagePolling(id){
  stopMessagePolling();
  messagePollTimer = setInterval(()=>{
    if(state.screen==='chat' && state.chatOpenId===id) loadMessagesFromServer(id);
    else stopMessagePolling();
  }, 4000);
}
function stopMessagePolling(){
  clearInterval(messagePollTimer);
  messagePollTimer = null;
}
let pendingReply = null;
function setReply(id, text){
  pendingReply = text;
  $('replyBar').innerHTML = `<div class="pinned-banner">↩ Replying to: "${esc(text)}" <button style="margin-left:auto;color:var(--slate)" onclick="clearReply()">✕</button></div>`;
}
function clearReply(){ pendingReply=null; $('replyBar').innerHTML=''; }
function sendMessage(id){
  const input = $('chatInput');
  if(!input.value.trim()) return;
  const text = input.value.trim();
  const chat = state.chats[id];
  input.value='';
  const reply = pendingReply;
  clearReply();
  if(isOnline()){
    chat.messages.push({from:'me', text, time:'now', reply});
    render(); go('chat', id);
    api(`/conversations/${id}/messages`, { method:'POST', body:{ text, type:'text', replyToId: reply || undefined } })
      .then(()=>loadMessagesFromServer(id))
      .catch(err=>alert(err.message));
    return;
  }
  chat.messages.push({from:'me', text, time:'now', reply});
  render(); go('chat', id);
}
function sendGif(id, label){
  const chat = state.chats[id];
  chat.messages.push({from:'me', type:'gif', text:label, time:'now'});
  $('gifTray').classList.add('hidden');
  go('chat', id);
  if(isOnline()){
    api(`/conversations/${id}/messages`, { method:'POST', body:{ text:label, type:'gif' } }).catch(err=>console.error(err));
  }
}
function sendSticker(id, s){
  const chat = state.chats[id];
  chat.messages.push({from:'me', type:'sticker', text:s, time:'now'});
  $('stickerTray').classList.add('hidden');
  go('chat', id);
  if(isOnline()){
    api(`/conversations/${id}/messages`, { method:'POST', body:{ text:s, type:'sticker' } }).catch(err=>console.error(err));
  }
}

/* ---------------------- NANO AI (rule-based coach) ---------------------- */
const NANO_SUGGESTIONS = ["I'm stuck on my goal", "Help me plan my week", "I missed my streak", "Give me a study tip", "Business idea feedback"];

    }
    return `<div class="bubble-wrap me"><div class="bubble">${esc(m.text)}</div></div>`;
  }).join('');
  return `
    <div class="chat-screen">
      <div class="nano-header">
        <div class="nano-orb">🤖</div>

        </div>

      </div>

      </div>

}
function scrollNanoBottom(){ setTimeout(()=>{ const b=$('nanoBody'); if(b) b.scrollTop=b.scrollHeight; },0); }
function submitNano(){
  const input = $('nanoInput');
  if(!input.value.trim()) return;
  sendToNano(input.value.trim());
  input.value='';
}
function sendToNano(text){
  state.nanoChat.push({from:'me', text});
  render();
  const typing = $('nanoTyping');
  if(typing) typing.innerHTML = `<div class="bubble-wrap them"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  scrollNanoBottom();
  setTimeout(()=>{
    const reply = nanoRespond(text);
    state.nanoChat.push(reply);
    render();
  }, 900);
}

/* Rule-based response engine following the Nano AI Master Identity persona.
   Personalizes using state.user + state.goals + state.badges + streaks. */
function nanoRespond(raw){
  const t = raw.toLowerCase();
  const cat = state.activeCategory;
  const g = state.goals[cat];
  const streak = state.user.goalStreak;

  const has = kw => kw.some(k=>t.includes(k));

  if(has(['stuck','can\'t','cant','hard','struggling','difficult'])){
    return {from:'nano', text:`It's completely normal to hit resistance — you're ${g.progress}% into ${cat}, and that's real progress, not nothing. Let's shrink the next step so it's almost impossible to skip. What's the smallest version of your next milestone ("${g.milestones.find(m=>!m.done)?.label || 'your next step'}") you could do in under 10 minutes?`, action:'Pick one 10-minute version of your next milestone and do it today.'};
  }
  if(has(['missed','fail','failed','broke my streak','messed up','gave up'])){
    return {from:'nano', text:`Hey — one missed day doesn't erase 12 days of real effort. What matters now is what you do next, not the miss itself. Streaks are a tool, not a verdict on you.`, action:'Restart today with one small action toward '+cat+'. That\'s the whole streak reset.'};
  }
  if(has(['week','plan my week','schedule','weekly plan'])){
    return {from:'nano', text:`Let's build a simple week around your ${cat} goal (currently ${g.progress}%). I'd suggest 3 focused sessions instead of trying to do it every day — consistency beats intensity. Anchor them to something you already do daily (after coffee, after lunch, etc.) so you don't rely on willpower.`, action:'Block 3 specific times this week for '+cat+' and put them in your calendar right now.'};
  }
  if(has(['study','studying','learn','learning','exam','course'])){
    return {from:'nano', text:`For learning that actually sticks, try active recall over re-reading: after each session, close the material and write down what you remember, then check gaps. Pair it with spaced repetition — review at 1 day, 3 days, then 7 days.`, action:'After your next study session, spend 5 minutes writing what you remember without looking.'};
  }
  if(has(['business','startup','idea','feedback on my idea','product'])){
    return {from:'nano', text:`I'd love to help sharpen it. The fastest way to know if a business idea has legs is to find out if anyone would pay for it before you build the whole thing. Who specifically has this problem, and how are they solving it today (even badly)?`, action:'Talk to 3 potential users this week and ask what they currently do about this problem.'};
  }
  if(has(['motivat','tired','exhausted','burnt out','burnout','don\'t feel like'])){
    return {from:'nano', text:`Motivation is unreliable by design — it comes and goes. What's kept your ${streak}-day streak alive is systems, not feelings. You don't need to feel ready, you just need the smallest next action to be easy enough to do anyway.`, action:'Do the 2-minute version of today\'s habit. Momentum builds from there.'};
  }
  if(has(['great','did it','done','completed','finished','proud','achieved','won'])){
    return {from:'nano', text:`That's genuinely awesome — well done. This is exactly the kind of consistent action that compounds. You're building real evidence that you follow through, and that matters more than any single win.`, action:'Log it as a check-in in your '+cat+' Goal Hub so your Cheer Squad can celebrate with you.'};
  }
  if(has(['money','finance','budget','save','saving','invest'])){
    return {from:'nano', text:`Financial goals get easier when they're automatic instead of willpower-based. A simple starting move: set up an automatic transfer to savings right after you get paid, before you can spend it. You're already 45% toward your first $1,000 — that habit alone got you there.`, action:'Set up (or check) one automatic transfer to savings this week.'};
  }
  if(has(['hi','hello','hey','sup','yo'])){
    return {from:'nano', text:`Hey ${state.user.name}! Good to see you. Your ${cat} goal is sitting at ${g.progress}% with a ${streak}-day streak — solid. What would be most useful right now: a plan, some encouragement, or feedback on something you're working on?`};
  }
  if(has(['who are you','what are you','what can you do'])){
    return {from:'nano', text:`I'm Nano — think of me as your Goal Coach, Life Coach, Study Partner, and Startup Mentor rolled into one, built into Nanochat. I personalize everything using your goals, streaks, and milestones so advice actually fits your life, not a generic template. I'll always try to end with one concrete next step.`};
  }

  // Default: goal-aware general coaching response
  return {from:'nano', text:`Thanks for sharing that. Looking at where you are — ${cat} at ${g.progress}%, ${streak}-day streak — the highest-leverage move is usually the smallest one you're avoiding. Tell me a bit more about what you're trying to move forward, and I'll help you break it into a next step.`, action:'Reply with one specific goal or problem, and I\'ll turn it into a concrete next step.'};
}

function handleAvatarUpload(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(isOnline()){
    const form = new FormData();
    form.append('avatar', file);
    api('/users/me/avatar', { method:'POST', body:form, isForm:true })
      .then(data => { state.user.avatarImage = API_BASE_URL + data.avatarUrl; render(); go('editprofile'); })
      .catch(err => alert(err.message));
    return;
  }
  const reader = new FileReader();
  reader.onload = function(ev){
    state.user.avatarImage = ev.target.result;
    render();
    go('editprofile');
  };
  reader.readAsDataURL(file);
}

  const name = $('editName').value.trim() || state.user.name;

  go('profile');
}

/* ---------------------- PERSISTENCE (localStorage) ---------------------- */
const STORAGE_KEY = 'nanochat-app-state';
function saveState(){
  try{
    const snapshot = {
      profile: state.profile,
      user: state.user,
      settings: state.settings,
      activeCategory: state.activeCategory,
      goals: state.goals,
      badges: state.badges,
      cheerSquad: state.cheerSquad,
      posts: state.posts,
      stories: state.stories,
      conversations: state.conversations,
      chats: state.chats,
      nanoChat: state.nanoChat,
      liveStreams: state.liveStreams,
    };
    const json = JSON.stringify(snapshot);
    if(json.length > 4_800_000) return; // avoid blowing past localStorage quota (~5MB)
    lsSet(STORAGE_KEY, json);
  }catch(err){
    // localStorage can throw if quota is exceeded or disabled — fail quietly, app still works
  }
}
function loadState(){
  try{
    const raw = lsGet(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      Object.assign(state, saved);
    }
  }catch(err){
    // no saved state yet, or corrupted — start fresh
  }
}

/* ---------------------- INIT ---------------------- */
(async function init(){
  loadState();
  document.getElementById('app').setAttribute('data-profile', state.profile);

  onUnauthorized = () => {
    // Only fires on a genuine 401 from the server (invalid/expired token) — never on network failures.
    authToken = null;
    lsRemove('nanochat-auth-token');
    renderAuth('login');
  };

  if (!API_BASE_URL) {
    render(); // no backend configured — pure local demo mode by design
    return;
  }

  const saved = lsGet('nanochat-auth-token');
  if (!saved) {
    renderAuth('login');
    return;
  }

  authToken = saved;
  try {
    const me = await api('/auth/me');
    applyUserFromServer(me.user);
    render();
    loadFeedFromServer();
  } catch (err) {
    if (err.status === 401 || err.status === 404) {
      // Token is genuinely invalid/expired, or the account no longer exists — safe to clear it.
      console.error('Nanochat: session invalid (status ' + err.status + ') —', err.message);
      authToken = null;
      lsRemove('nanochat-auth-token');
      renderAuth('login');
    } else {
      // Network failure, CORS block, or 5xx server error — the token is still potentially valid.
      // Do NOT clear it. Show a retry screen instead of forcing the user back to login.
      console.error('Nanochat: could not verify session (temporary error) —', err.message);
      renderConnectionError(err.message);
    }
  }
})();
</script>
